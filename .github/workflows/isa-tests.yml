name: RV64 ISA corpus (rebuilt from source)

# The checked-in rv64 test binaries are what `make isas-all` (ci.yml) runs. This job rebuilds them
# from riscv-tests with the RISC-V toolchain and runs the fresh binaries, so toolchain or test
# drift is caught instead of hiding behind stale checked-in ELFs.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  rebuild-rv64-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies and RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsdl2-dev gcc-riscv64-unknown-elf

      - name: Build the rv64 emulator
        run: make -C rve XLEN=64 all

      - name: Rebuild the rv64 ISA tests from source
        run: |
          scripts/build_isa64.sh /tmp/isa-rv64
          scripts/build_isa64.sh /tmp/isa-rv64-v --virtual
          scripts/build_isa64.sh /tmp/isa-rv64-rve --custom

      - name: Run the fresh binaries
        run: |
          scripts/run_isa.sh rve/build64/rve64 /tmp/isa-rv64
          scripts/run_isa.sh rve/build64/rve64 /tmp/isa-rv64-v
          scripts/run_isa.sh rve/build64/rve64 /tmp/isa-rv64-rve
